name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint "src/**/*.ts"

      - name: Test
        run: npx jest --ci

      - name: Build
        run: npm run build

      - name: UI build (typecheck + vite)
        run: npm --prefix apps/macos/ui ci && npm --prefix apps/macos/ui run build

  rust-core:
    name: Rust core tests + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Ensure cmake (llama.cpp build dep)
        run: command -v cmake || (sudo apt-get update && sudo apt-get install -y cmake)

      # dokumente-core only: the Tauri app shell does not link on Linux
      # (webkit2gtk), same scope as the macOS release workflow.
      - name: Test core crate (default features)
        run: cargo test -p dokumente-core

      - name: Test core crate (llama features)
        run: cargo test -p dokumente-core --features llama

      - name: Clippy (default features, zero warnings)
        run: cargo clippy -p dokumente-core --all-targets -- -D warnings

  retrieval-models:
    name: Python retrieval service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/retrieval-models
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Full requirements (torch CPU on the runner) + test-only extras.
      # The tests never enter the lifespan, so no model is downloaded.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Pytest (contract tests, no model download)
        run: python -m pytest tests/ -q
